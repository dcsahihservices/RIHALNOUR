<!doctype html>
<html lang="fr" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>RIHAL NOUR – رحال نور</title>
<meta name="description" content="RIHAL NOUR, agence de voyages à Oujda (Maroc) : billetterie aérienne, voyages organisés, Omra, hôtels et séjours. Le monde à votre portée.">
<meta name="theme-color" content="#123C46">
<link rel="icon" href="images/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Figtree:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body data-page="contact" data-title="t_contact">
<div id="hdr"></div>
<main id="main">
<section class="phead dark"><div class="wrap"><h1 data-i18n="ct_h"></h1><p data-i18n="ct_p"></p></div></section>
<section class="sec">
  <div class="wrap ct-g">
    <ul class="cinfo" data-render="cinfo"></ul>
    <form id="cform" class="form" novalidate>
      <h2 data-i18n="f_h"></h2>
      <div class="field"><label for="f-name" data-i18n="f_name"></label><input id="f-name" name="name" data-v="name" autocomplete="name"><span class="err" role="alert"></span></div>
      <div class="field"><label for="f-phone" data-i18n="f_phone"></label><input id="f-phone" name="phone" data-v="phone" type="tel" autocomplete="tel" inputmode="tel"><span class="err" role="alert"></span></div>
      <div class="field"><label for="f-email" data-i18n="f_email"></label><input id="f-email" name="email" data-v="email" type="email" autocomplete="email"><span class="err" role="alert"></span></div>
      <div class="field"><label for="f-dest" data-i18n="f_dest"></label>
        <select id="f-dest" name="dest">
          <option value="" data-i18n="f_dest_any"></option>
          <option value="tr" data-i18n="d_tr"></option><option value="fr" data-i18n="d_fr"></option><option value="es" data-i18n="d_es"></option>
          <option value="ae" data-i18n="d_ae"></option><option value="sa" data-i18n="d_sa"></option><option value="ma" data-i18n="d_ma"></option>
          <option value="omra" data-i18n="f_omra"></option>
        </select></div>
      <div class="field"><label for="f-msg" data-i18n="f_msg"></label><textarea id="f-msg" name="msg" data-v="msg"></textarea><span class="err" role="alert"></span></div>
      <div class="btns" style="margin:0">
        <button type="button" id="send-wa" class="btn btn-wa"><i data-icon="wa"></i><span data-i18n="f_send_wa"></span></button>
        <button type="button" id="send-mail" class="btn btn-ink"><i data-icon="mail"></i><span data-i18n="f_send_mail"></span></button>
      </div>
      <p id="fstatus" role="status"></p>
    </form>
  </div>
</section>
<section class="sec sec-alt">
  <div class="wrap">
    <h2 data-i18n="map_h" style="margin-bottom:1.4rem"></h2>
    <div class="map" data-render="map"></div>
  </div>
</section>
</main>
<div id="ftr"></div>
<script src="js/config.js"></script>
<script src="js/i18n.js"></script>
<script src="js/main.js"></script>
</body>
</html>

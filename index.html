<!doctype html>
<html lang="fr" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>RIHAL NOUR – رحال نور</title>
<meta name="description" content="RIHAL NOUR, agence de voyages à Oujda (Maroc) : billetterie aérienne, voyages organisés, Omra, hôtels et séjours. Le monde à votre portée.">
<meta name="theme-color" content="#123C46">
<link rel="icon" href="images/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Figtree:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body data-page="home" data-title="t_home">
<div id="hdr"></div>
<main id="main">
<section class="hero dark">
  <div class="wrap hero-g">
    <div class="hero-t">
      <p class="slogan" data-i18n="slogan"></p>
      <h1 data-i18n="hero_h"></h1>
      <p class="lead" data-i18n="hero_p"></p>
      <div class="btns">
        <a class="btn btn-wa" data-wa="generic" data-i18n="cta_wa"><i data-icon="wa"></i></a>
        <a class="btn btn-line" href="#offres" data-i18n="cta_offers"></a>
      </div>
    </div>
    <div class="arch ph i-hero" role="img" aria-label="RIHAL NOUR"></div>
  </div>
</section>

<section class="sec sec-alt">
  <div class="wrap two">
    <div>
      <h2 data-i18n="about_h"></h2>
      <p data-i18n="about_p1"></p>
      <p data-i18n="about_p2"></p>
      <div class="btns"><a class="btn btn-ink" href="services.html" data-i18n="nav_services"></a></div>
    </div>
    <div class="arch ph i-morocco" role="img" aria-label="Maroc"></div>
  </div>
</section>

<section class="sec">
  <div class="wrap">
    <div class="sec-head"><h2 data-i18n="sec_sv_h"></h2><p data-i18n="sec_sv_p"></p></div>
    <div class="grid3" data-render="svc"></div>
  </div>
</section>

<section class="sec sec-alt">
  <div class="wrap">
    <div class="sec-head"><h2 data-i18n="sec_ds_h"></h2><p data-i18n="sec_ds_p"></p></div>
    <div class="tiles" data-render="dest"></div>
  </div>
</section>

<section class="sec" id="offres">
  <div class="wrap">
    <div class="sec-head"><h2 data-i18n="of_h"></h2><p class="note" data-i18n="of_note"></p></div>
    <div class="offers" data-render="offers"></div>
  </div>
</section>

<section class="sec dark">
  <div class="wrap omra-g">
    <div class="pair">
      <div class="arch ph i-makkah" role="img" aria-label="Makkah"></div>
      <div class="arch ph i-madinah" role="img" aria-label="Madinah"></div>
    </div>
    <div>
      <h2 data-i18n="om_h"></h2>
      <p data-i18n="om_p"></p>
      <ul class="checks" data-render="omraShort"></ul>
      <div class="btns">
        <a class="btn btn-gold" href="omra.html" data-i18n="cta_omra"></a>
        <a class="btn btn-line" data-wa="omra" data-i18n="cta_quote"><i data-icon="wa"></i></a>
      </div>
    </div>
  </div>
</section>

<section class="sec">
  <div class="wrap">
    <h2 data-i18n="why_h"></h2>
    <ul class="why" data-render="why" style="margin-top:2rem"></ul>
  </div>
</section>

<section class="sec sec-alt">
  <div class="wrap">
    <h2 data-i18n="rv_h" style="margin-bottom:1.6rem"></h2>
    <div class="revs" data-render="reviews"></div>
    <p class="note" data-i18n="rv_note"></p>
  </div>
</section>
<section class="cta dark" data-render="cta"></section>
</main>
<div id="ftr"></div>
<script src="js/config.js"></script>
<script src="js/i18n.js"></script>
<script src="js/main.js"></script>
</body>
</html>
